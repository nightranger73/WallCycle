# Copia questo file in .github/workflows/release.yml nel tuo repository GitHub.
# Ogni push di un tag v* (es. git tag v1.0.0 && git push --tags) genera in Qt6:
#   - wallcycle_<version>_amd64.deb (Debian / Ubuntu Qt6)
#   - wallcycle-<version>-1.fedora.x86_64.rpm (Fedora Qt6)
#   - wallcycle-<version>-1.opensuse.x86_64.rpm (openSUSE Tumbleweed Qt6)
#   - WallCycle-<version>-x86_64.AppImage (Linux AppImage Qt6 portatile con plugin Wayland/XCB completi)
#   - WallCycle-Setup-<version>-x64.exe (Windows 64-bit Installer)

name: Release WallCycle Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  build-deb:
    needs: resolve-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install FPC, Lazarus Qt5 and dpkg
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc lazarus lcl-qt5 libqt5pas-dev git dpkg

      - name: Clone & build TUniqueInstance (luipack Qt5)
        run: |
          git clone --depth=1 https://github.com/blikblum/luipack.git /tmp/luipack
          mkdir -p /tmp/lazcfg
          lazbuild --pcp=/tmp/lazcfg --widgetset=qt5 /tmp/luipack/uniqueinstance/uniqueinstance_package.lpk

      - name: Build WallCycle (Linux Qt5) and create .deb
        run: |
          lazbuild --pcp=/tmp/lazcfg --widgetset=qt5 --build-mode=Release -B WallCycle.lpi
          chmod +x build-deb.sh
          ./build-deb.sh "${{ needs.resolve-version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-deb
          path: wallcycle_*.deb

  build-rpm-fedora:
    needs: resolve-version
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FPC, Lazarus Qt6, qt6pas-devel and rpm-build on Fedora
        run: |
          dnf install -y fpc lazarus lazarus-lcl-qt6 qt6pas qt6pas-devel rpm-build git

      - name: Build WallCycle (Qt6) and package Fedora RPM
        run: |
          git clone --depth=1 https://github.com/blikblum/luipack.git /tmp/luipack
          RPMTOP="$HOME/rpmbuild"
          mkdir -p /tmp/lazcfg "$RPMTOP"/{SOURCES,SPECS,RPMS,BUILD,SRPMS}
          lazbuild --pcp=/tmp/lazcfg --widgetset=qt6 /tmp/luipack/uniqueinstance/uniqueinstance_package.lpk
          lazbuild --pcp=/tmp/lazcfg --widgetset=qt6 --build-mode=Release -B WallCycle.lpi

          cp bin/WallCycle "$RPMTOP/SOURCES/WallCycle"
          cp wallcycle.desktop "$RPMTOP/SOURCES/wallcycle.desktop"
          cp wallcycle.png "$RPMTOP/SOURCES/wallcycle.png"
          cp README.md "$RPMTOP/SOURCES/README.md"
          rpmbuild -bb --define "_topdir $RPMTOP" --define "_version ${{ needs.resolve-version.outputs.version }}" wallcycle.spec
          cp "$RPMTOP"/RPMS/x86_64/wallcycle-*.rpm "wallcycle-${{ needs.resolve-version.outputs.version }}-1.fedora.x86_64.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-rpm-fedora
          path: wallcycle-*.fedora.x86_64.rpm

  build-rpm-opensuse:
    needs: resolve-version
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed
    steps:
      - uses: actions/checkout@v4

      - name: Install FPC, Lazarus Qt6, libQt6Pas-devel and rpm-build on openSUSE
        run: |
          zypper --non-interactive --gpg-auto-import-keys ar -f https://download.opensuse.org/repositories/devel:/languages:/pascal/openSUSE_Tumbleweed/devel:languages:pascal.repo
          zypper --non-interactive --gpg-auto-import-keys refresh
          zypper --non-interactive install fpc lazarus lazarus-lcl-qt6 libQt6Pas6 libQt6Pas-devel rpm-build git

      - name: Build WallCycle (Qt6) and package openSUSE RPM
        run: |
          git clone --depth=1 https://github.com/blikblum/luipack.git /tmp/luipack
          RPMTOP="$HOME/rpmbuild"
          mkdir -p /tmp/lazcfg "$RPMTOP"/{SOURCES,SPECS,RPMS,BUILD,SRPMS}
          lazbuild --pcp=/tmp/lazcfg --widgetset=qt6 /tmp/luipack/uniqueinstance/uniqueinstance_package.lpk
          lazbuild --pcp=/tmp/lazcfg --widgetset=qt6 --build-mode=Release -B WallCycle.lpi

          cp bin/WallCycle "$RPMTOP/SOURCES/WallCycle"
          cp wallcycle.desktop "$RPMTOP/SOURCES/wallcycle.desktop"
          cp wallcycle.png "$RPMTOP/SOURCES/wallcycle.png"
          cp README.md "$RPMTOP/SOURCES/README.md"
          rpmbuild -bb --define "_topdir $RPMTOP" --define "_version ${{ needs.resolve-version.outputs.version }}" wallcycle.spec
          cp "$RPMTOP"/RPMS/x86_64/wallcycle-*.rpm "wallcycle-${{ needs.resolve-version.outputs.version }}-1.opensuse.x86_64.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-rpm-opensuse
          path: wallcycle-*.opensuse.x86_64.rpm

  build-appimage:
    needs: resolve-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Lazarus Stable
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: 'stable'

      - name: Install Qt6 development libraries and build libQt6Pas
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-wayland qmake6 build-essential patchelf desktop-file-utils curl \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0
          CBINDINGS_PRO="$(find "$HOME" /usr /opt -name 'Qt6Pas.pro' 2>/dev/null | head -n 1)"
          echo "Building Qt6Pas from: $CBINDINGS_PRO"
          rm -rf /tmp/qt6pas-build
          cp -r "$(dirname "$CBINDINGS_PRO")" /tmp/qt6pas-build
          chmod -R u+w /tmp/qt6pas-build
          pushd /tmp/qt6pas-build
          qmake6 Qt6Pas.pro
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          popd

      - name: Build WallCycle (Qt6)
        run: |
          git clone --depth=1 https://github.com/blikblum/luipack.git /tmp/luipack
          mkdir -p /tmp/lazcfg
          lazbuild --pcp=/tmp/lazcfg --widgetset=qt6 /tmp/luipack/uniqueinstance/uniqueinstance_package.lpk
          lazbuild --pcp=/tmp/lazcfg --widgetset=qt6 --build-mode=Release -B WallCycle.lpi

      - name: Build AppImage (tools kept outside workspace in /tmp)
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          rm -rf /tmp/AppDir dist-appimage
          mkdir -p /tmp/AppDir/usr/bin /tmp/AppDir/usr/lib /tmp/AppDir/usr/plugins \
                   /tmp/AppDir/usr/share/applications \
                   /tmp/AppDir/usr/share/icons/hicolor/512x512/apps dist-appimage

          install -Dm755 bin/WallCycle /tmp/AppDir/usr/bin/wallcycle
          install -Dm644 wallcycle.desktop /tmp/AppDir/usr/share/applications/wallcycle.desktop
          sed -i 's|^Exec=/usr/bin/wallcycle|Exec=wallcycle|g' /tmp/AppDir/usr/share/applications/wallcycle.desktop
          cp -av /usr/local/lib/libQt6Pas.so* /tmp/AppDir/usr/lib/ 2>/dev/null || \
            cp -av /usr/lib/*/libQt6Pas.so* /tmp/AppDir/usr/lib/ 2>/dev/null || true

          QT6_PLUGINS="$(qtpaths6 --query QT_INSTALL_PLUGINS 2>/dev/null || echo /usr/lib/x86_64-linux-gnu/qt6/plugins)"
          for pdir in platforms xcbglintegrations wayland-shell-integration wayland-graphics-integration-client wayland-decoration-client imageformats platformthemes; do
            if [ -d "$QT6_PLUGINS/$pdir" ]; then
              cp -r "$QT6_PLUGINS/$pdir" /tmp/AppDir/usr/plugins/
            fi
          done
          printf '[Paths]\nPrefix = ..\nPlugins = plugins\n' > /tmp/AppDir/usr/bin/qt.conf

          install -Dm644 wallcycle.png /tmp/AppDir/usr/share/icons/hicolor/512x512/apps/wallcycle.png

          curl -fsSL -o /tmp/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy-x86_64.AppImage

          QT6PAS_LIB="$(ldconfig -p | awk '/libQt6Pas\.so\.6/{print $NF; exit}')"
          DEPLOY_PLUGIN_ARGS=()
          while IFS= read -r -d '' pso; do
            DEPLOY_PLUGIN_ARGS+=(--deploy-deps-only "$pso")
          done < <(find /tmp/AppDir/usr/plugins -type f -name '*.so' -print0)

          pushd /tmp
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/linuxdeploy-x86_64.AppImage \
            --appdir /tmp/AppDir \
            --executable /tmp/AppDir/usr/bin/wallcycle \
            ${QT6PAS_LIB:+--library "$QT6PAS_LIB"} \
            "${DEPLOY_PLUGIN_ARGS[@]}"

          find /tmp/AppDir/usr/plugins -type f -name '*.so' -exec patchelf --set-rpath '$ORIGIN/../../lib' {} +

          ls /tmp/AppDir/usr/lib/libQt6WaylandClient.so* >/dev/null
          ls /tmp/AppDir/usr/lib/libQt6XcbQpa.so* >/dev/null

          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/linuxdeploy-x86_64.AppImage \
            --appdir /tmp/AppDir \
            --desktop-file /tmp/AppDir/usr/share/applications/wallcycle.desktop \
            --icon-file /tmp/AppDir/usr/share/icons/hicolor/512x512/apps/wallcycle.png \
            --output appimage
          popd

          OUT_APPIMAGE="dist-appimage/WallCycle-${VER}-x86_64.AppImage"
          mv /tmp/WallCycle*.AppImage "$OUT_APPIMAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-appimage
          path: dist-appimage/WallCycle-*.AppImage

  build-windows-installer:
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Lazarus Stable (Windows x64)
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: 'stable'

      - name: Build TUniqueInstance and WallCycle.exe
        shell: pwsh
        run: |
          git clone --depth=1 https://github.com/blikblum/luipack.git "$env:TEMP\luipack"
          New-Item -ItemType Directory -Force -Path "$env:TEMP\lazcfg" | Out-Null
          lazbuild --pcp="$env:TEMP\lazcfg" "$env:TEMP\luipack\uniqueinstance\uniqueinstance_package.lpk"
          lazbuild --pcp="$env:TEMP\lazcfg" --os=win64 --cpu=x86_64 --build-mode=Release -B WallCycle.lpi

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }
          & $iscc "/DAppVersion=${{ needs.resolve-version.outputs.version }}" wallcycle.iss

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-installer
          path: dist-installer/WallCycle-Setup-*.exe

  publish-release:
    needs: [resolve-version, build-deb, build-rpm-fedora, build-rpm-opensuse, build-appimage, build-windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release with .deb, .rpm, AppImage and .exe
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.exe
            artifacts/WallCycle-*.AppImage
